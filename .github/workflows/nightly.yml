name: Nightly Build

# A fully signed, notarized and stapled build of main, version X.Y.Z-<timestamp>.<hash>, published as a GitHub
# pre-release tagged nightly-<version>. Not a Manager release (never "latest", no vX.Y.Z tag). Skipped when main is
# unchanged since the latest nightly; only the last 7 nightlies are kept (older ones are deleted with their tags).
on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Build even if main has not changed since the latest nightly
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      # Skip when the latest nightly was built from this same commit (a failed earlier attempt left no release, so it retries).
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '[.[] | select(.tagName | startswith("nightly-"))][0].tagName // ""')"
          built=""
          if [ -n "$last" ]; then
            built="$(gh release view "$last" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
          fi
          if [ "$built" = "$GITHUB_SHA" ] && [ '${{ inputs.force }}' != true ]; then
            echo "main is unchanged since $last; skipping"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    uses: ./.github/workflows/unit-tests.yml

  package:
    needs: unit-tests
    uses: ./.github/workflows/package.yml
    secrets: inherit
    with:
      kind: nightly


  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: dist
      - name: Create pre-release
        run: |
          gh release create '${{ needs.package.outputs.tag }}' dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Nightly ${{ needs.package.outputs.version }}' \
            --notes "Nightly build of main at $GITHUB_SHA. Not a release." \
            --prerelease --latest=false
      - name: Keep only the last 7 nightlies
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("nightly-"))] | sort_by(.createdAt) | reverse | .[7:][].tagName' |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done

name: CodeQL

# Replaces GitHub's "default setup" (disable it under Settings > Code security, or it rejects these uploads).
# `actions` always runs. Swift is opt-in (set the repository variable CODEQL_SWIFT=true): it needs a traced build, and on
# the hosted runners CodeQL's tracer fails with this project (default setup's autobuild segfaulted, exit 139; a manual
# xcodebuild under the tracer fails with "Bad CPU type in executable" loading Xcode 27's swift-plugin-server, so the
# @Observable macros cannot expand). Swift does not support build-mode none. Try it on a self-hosted Mac via RUNNER_LABELS.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: ${{ matrix.language != 'swift' || vars.CODEQL_SWIFT == 'true' }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: '["ubuntu-latest"]'
            build-mode: none
          - language: swift
            runner: ${{ vars.RUNNER_LABELS || '["xcode-27"]' }}
            build-mode: manual
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build (Swift)
        if: ${{ matrix.language == 'swift' }}
        run: |
          xcodebuild clean build \
            -project ArtCraftAppManager.xcodeproj \
            -scheme ArtCraftAppManager \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
